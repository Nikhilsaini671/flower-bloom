<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finger Flower Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: #eee;
        }
        #container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 5px;
            z-index: 10;
            text-align: center;
        }
        #hud {
            margin-top: 12px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
        #stats {
            color: #6BCB77;
            font-weight: bold;
        }
        #burst-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,107,107,0.85);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
    </style>

</head>
<body>

    <div id="container">
        <div id="loading">Loading AI Model, please wait...</div>
        <div id="burst-indicator">✨ BURST!</div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="hud">
        Move your fingers to plant flowers &nbsp;|&nbsp; Pinch thumb + index for a burst &nbsp;|&nbsp; Press <b>C</b> to clear<br>
        <span id="stats">0 flowers on screen</span>
    </div>

    <script type="module">
        import {
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const loadingDiv = document.getElementById("loading");
        const statsEl = document.getElementById("stats");
        const burstIndicator = document.getElementById("burst-indicator");

        let handLandmarker = undefined;
        let lastVideoTime = -1;
        let flowerParticles = [];

        // cooldown so pinch doesn't spam bursts every single frame
        let pinchCooldown = 0;

        class Flower {
            constructor(x, y, big = false) {
                this.x = x;
                this.y = y;
                this.size = big
                    ? Math.random() * 20 + 25
                    : Math.random() * 15 + 15;
                this.colors = ['#FF6B6B', '#4D96FF', '#6BCB77', '#FFD93D', '#F473B9'];
                this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.rotation = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.05;
                this.vx = (Math.random() - 0.5) * (big ? 4 : 2);
                this.vy = (Math.random() - 0.5) * (big ? 4 : 2) - 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.spin;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;

                // 5 elongated petals instead of plain overlapping circles
                for (let i = 0; i < 5; i++) {
                    ctx.save();
                    ctx.rotate((i * 2 * Math.PI) / 5);
                    ctx.beginPath();
                    ctx.ellipse(0, -this.size / 2, this.size / 3.5, this.size / 2, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.restore();
                }

                // center core
                ctx.beginPath();
                ctx.fillStyle = '#FFFFFF';
                ctx.arc(0, 0, this.size / 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            }
        }

        async function createHandLandmarker() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2 // feature: track both hands now
            });
            loadingDiv.style.display = "none";
            startWebcam();
        }
        createHandLandmarker();

        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then((stream) => {
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                })
                .catch((err) => {
                    console.error("Webcam access denied: ", err);
                    loadingDiv.style.display = "block";
                    loadingDiv.innerText = "Camera access required!";
                });
        }

        function distance(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function spawnBurst(x, y) {
            for (let i = 0; i < 15; i++) {
                flowerParticles.push(new Flower(x, y, true));
            }
            burstIndicator.style.opacity = 1;
            setTimeout(() => (burstIndicator.style.opacity = 0), 300);
        }

        async function predictWebcam() {
            if (canvasElement.width !== video.videoWidth) {
                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;
            }

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const startTimeMs = performance.now();
                const results = handLandmarker.detectForVideo(video, startTimeMs);

                if (pinchCooldown > 0) pinchCooldown--;

                if (results.landmarks && results.landmarks.length > 0) {
                    for (const hand of results.landmarks) {
                        const indexTip = hand[8];
                        const thumbTip = hand[4];

                        const pixelX = indexTip.x * canvasElement.width;
                        const pixelY = indexTip.y * canvasElement.height;

                        // regular flower trail at index fingertip
                        flowerParticles.push(new Flower(pixelX, pixelY));

                        // pinch detection: thumb tip close to index tip
                        if (distance(indexTip, thumbTip) < 0.045 && pinchCooldown === 0) {
                            spawnBurst(pixelX, pixelY);
                            pinchCooldown = 20; // ~20 frames before next burst allowed
                        }
                    }
                }
            }

            for (let i = flowerParticles.length - 1; i >= 0; i--) {
                flowerParticles[i].update();
                flowerParticles[i].draw(canvasCtx);
                if (flowerParticles[i].alpha <= 0) {
                    flowerParticles.splice(i, 1);
                }
            }

            statsEl.textContent = `${flowerParticles.length} flowers on screen`;

            window.requestAnimationFrame(predictWebcam);
        }

        // feature: press 'C' to clear all flowers instantly
        window.addEventListener("keydown", (e) => {
            if (e.key.toLowerCase() === "c") {
                flowerParticles = [];
            }
        });
    </script>
</body>
</html>
